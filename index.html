<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: rea-image:; font-src 'self' data:; connect-src 'none'; worker-src 'self' blob:"><title>REA Markdown</title></head><body><div id="app"><header><strong>REA <span>Markdown</span></strong><div id="title">未命名.md</div><nav><button data-action="open">打开</button><button data-action="save">保存</button><button data-action="source" id="mode">源码</button><button data-action="image">图片</button><button data-action="focus">专注</button><button data-action="theme">◐</button></nav></header><div id="workspace"><aside><div class="aside-title">工作空间 <button data-action="folder" title="打开文件夹">＋</button></div><div id="folder-tools" hidden><span id="folder-name"></span><button data-action="refreshFolder" title="刷新目录" aria-label="刷新目录">↻</button><button data-action="revealFile" title="定位当前文件" aria-label="定位当前文件">◎</button></div><button id="rename-file" data-action="rename">重命名当前文件…</button><div id="files"><p class="muted">打开文件夹，开始整理你的文字。</p></div><div class="aside-title">文档大纲</div><div id="outline"></div><div class="sidebar-note">写作，从一个想法开始。<br>本地 Markdown · 自由保存</div></aside><main><div id="findbar" hidden role="search" aria-label="查找与替换"><div class="find-row"><input id="query" aria-label="查找文本" placeholder="查找文本"><span id="find-count" role="status">0 / 0</span><button id="find-previous" data-action="findPrevious">上一个</button><button id="find-next" data-action="findNext">下一个</button><label><input type="checkbox" id="match-case">区分大小写</label><button data-action="closeFind">关闭</button></div><div class="find-row"><input id="replacement" aria-label="替换文本" placeholder="替换为（留空可删除）"><button id="replace-one" data-action="replaceOne">替换</button><button id="replace-all" data-action="replaceAll">全部替换</button><span id="find-scope">范围：正文（不跨段落）</span></div></div><div id="external-change" hidden role="status"><span id="external-message"></span><button data-action="reload">重新载入磁盘版本</button><button data-action="saveAs">另存为…</button></div><div id="editor"></div><textarea id="source" spellcheck="false" hidden aria-label="Markdown 源码"></textarea></main></div><footer><span id="status">就绪</span><span id="count"></span></footer></div><script type="module" src="/src/main.js"></script></body></html>
