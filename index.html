<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: rea-image:; font-src 'self' data:; connect-src 'none'; worker-src 'self' blob:"><title>REA Markdown</title></head><body><div id="app"><header><strong>REA <span>Markdown</span></strong><div id="title">未命名.md</div><nav><button data-action="open">打开</button><button data-action="save">保存</button><button data-action="source" id="mode">源码</button><button data-action="image">图片</button><button data-action="frontMatter">元数据</button><button data-action="focus">专注</button><button data-action="typewriter" id="typewriter-toggle" aria-pressed="false">打字机</button><button data-action="theme" aria-label="切换明暗主题">◐</button><button data-action="preferences">设置</button></nav></header><div id="workspace"><aside><div class="aside-title">工作空间 <button data-action="folder" title="打开文件夹">＋</button></div><div id="folder-tools" hidden><span id="folder-name"></span><button data-action="refreshFolder" title="刷新目录" aria-label="刷新目录">↻</button><button data-action="revealFile" title="定位当前文件" aria-label="定位当前文件">◎</button></div><div class="workspace-create"><button data-action="createDocument">新建文档…</button><button data-action="createFolder">新建文件夹…</button></div><button id="rename-file" data-action="rename">重命名当前文件…</button><button id="workspace-search-toggle" data-action="workspaceSearch">搜索工作空间…</button><section id="workspace-search" hidden aria-label="工作空间搜索"><input id="workspace-query" aria-label="工作空间搜索文本" placeholder="搜索已保存文件" maxlength="256"><label><input id="workspace-case" type="checkbox">区分大小写</label><div><button id="workspace-run">搜索</button><button id="workspace-close" data-action="closeWorkspaceSearch">关闭</button></div><p id="workspace-summary" role="status">搜索磁盘上已保存的 Markdown / 文本。</p><div id="workspace-results"></div></section><div id="files"><p class="muted">打开文件夹，开始整理你的文字。</p></div><div class="aside-title">文档大纲</div><div id="outline"></div><div class="sidebar-note">写作，从一个想法开始。<br>本地 Markdown · 自由保存</div></aside><main><div id="findbar" hidden role="search" aria-label="查找与替换"><div class="find-row"><input id="query" aria-label="查找文本" placeholder="查找文本"><span id="find-count" role="status">0 / 0</span><button id="find-previous" data-action="findPrevious">上一个</button><button id="find-next" data-action="findNext">下一个</button><label><input type="checkbox" id="match-case">区分大小写</label><button data-action="closeFind">关闭</button></div><div class="find-row"><input id="replacement" aria-label="替换文本" placeholder="替换为（留空可删除）"><button id="replace-one" data-action="replaceOne">替换</button><button id="replace-all" data-action="replaceAll">全部替换</button><span id="find-scope">范围：正文（不跨段落）</span></div></div><div id="external-change" hidden role="status"><span id="external-message"></span><button data-action="reload">重新载入磁盘版本</button><button data-action="saveAs">另存为…</button></div><div id="editor"></div><textarea id="source" spellcheck="false" hidden aria-label="Markdown 源码"></textarea></main></div><footer><span id="status">就绪</span><span id="count"></span></footer><dialog id="preferences" aria-labelledby="preferences-title"><h2 id="preferences-title">写作设置</h2><div class="settings-grid"><label>主题<select id="pref-theme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></label><label>正文字体<select id="pref-fontFamily"><option value="system">系统字体</option><option value="serif">宋体 / 衬线</option><option value="mono">等宽</option></select></label><label>字号<select id="pref-fontSize"><option>14</option><option>16</option><option>18</option><option>20</option><option>22</option></select></label><label>行距<select id="pref-lineHeight"><option value="1.6">紧凑 · 1.6</option><option value="1.9">舒适 · 1.9</option><option value="2.2">宽松 · 2.2</option></select></label><label>排版区域宽度<select id="pref-contentWidth"><option value="700">窄 · 700 px</option><option value="900">标准 · 900 px</option><option value="1100">宽 · 1100 px</option></select></label><label class="checkbox-label"><input type="checkbox" id="pref-typewriter">打字机模式（排版）</label></div><p>设置自动保存到本机，不修改 Markdown 文件。源码使用等宽字体；打字机模式在排版编辑时生效。</p><div id="settings-status" role="status"></div><div class="settings-actions"><button data-action="resetPreferences">恢复默认</button><button data-action="closePreferences">完成</button></div></dialog></div><script type="module" src="/src/main.js"></script></body></html>
